name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build static release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/appwarm dist/
          tar -C dist -czf "appwarm-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" appwarm
          sha256sum "appwarm-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" > "appwarm-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: appwarm-v*.tar.gz*

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build flake package
        run: nix build .#appwarm --no-update-lock-file
      - name: Check flake outputs
        run: nix flake check --no-build --no-update-lock-file
      - name: Check prebuilt patched Niri
        run: |
          nix build .#niri-appwarm-prebuilt --no-update-lock-file --out-link result-niri-prebuilt
          ./result-niri-prebuilt/bin/niri --version | grep -F 'appwarm-hidden-'

  niri:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check release version
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
      - name: Build patched Niri
        run: nix build .#niri-appwarm --no-update-lock-file
      - name: Package patched Niri output
        run: |
          asset="niri-appwarm-${GITHUB_REF_NAME}-x86_64-linux.tar.gz"
          tar -C ./result -czf "$asset" .
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: niri-release
          path: niri-appwarm-v*.tar.gz*
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, nix, niri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: actions/download-artifact@v4
        with:
          name: niri-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" appwarm-v*.tar.gz* niri-appwarm-v*.tar.gz* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
